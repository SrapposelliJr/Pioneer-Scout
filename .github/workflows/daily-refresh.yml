name: Daily Pioneer Scout Refresh

on:
  workflow_dispatch:

  schedule:
    # 10:00 AM Pacific during daylight saving time = 17:00 UTC
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          packages <- c(
            "shiny",
            "tidyverse",
            "rvest",
            "janitor",
            "stringr",
            "lubridate",
            "httr",
            "jsonlite",
            "randomForest",
            "caret",
            "DT",
            "plotly",
            "scales"
          )

          missing <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            install.packages(missing)
          }

      - name: Refresh database
        run: Rscript 99_refresh_database.R

      - name: Show changed files
        run: git status --short

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No database changes detected."
          else
            git commit -m "Automated Pioneer Scout database refresh"
            git push
          fi
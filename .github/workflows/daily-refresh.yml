name: Daily Pioneer Scout Refresh

on:
  # GitHub Actions schedules use UTC. Run at both possible UTC offsets, then
  # use the Pacific-time guard below so the refresh always happens at 10 AM
  # America/Los_Angeles through daylight-saving changes.
  schedule:
    - cron: "5 17,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pioneer-scout-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm today's Pacific refresh is still needed
        id: refresh_window
        shell: bash
        run: |
          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          pacific_date="$(TZ=America/Los_Angeles date '+%B %-d, %Y')"

          if [ "$pacific_hour" -ge 10 ] && ! grep -qF "$pacific_date" data/processed/last_updated.txt; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up R
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install R packages
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        shell: Rscript {0}
        run: |
          packages <- c(
            "shiny",
            "tidyverse",
            "rvest",
            "janitor",
            "stringr",
            "lubridate",
            "httr",
            "jsonlite",
            "randomForest",
            "caret",
            "DT",
            "plotly",
            "scales"
          )

          missing <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            install.packages(missing)
          }

      - name: Refresh database
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: Rscript 99_refresh_database.R

      - name: Show changed files
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: git status --short

      - name: Commit refreshed data
        if: steps.refresh_window.outputs.run_refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No database changes detected."
          else
            git commit -m "Automated Pioneer Scout database refresh"
            git push
          fi
